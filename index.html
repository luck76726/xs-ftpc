  const listBox = (title, note, items, table, col, inputId, pattern, hint, label) => h("div", { class: "card" }, h("h3", null, title + " · " + items.length), h("p", { class: "meta" }, note),
    h("div", { class: "row" }, h("input", { type: "text", id: inputId, maxlength: "20", "aria-label": label, placeholder: label }), h("button", { class: "btn", type: "button", onclick: () => addListed(table, col, inputId, pattern, hint) }, "Add")),
    h("details", null, h("summary", null, "Show the list"), h("div", { class: "row" }, items.map((it) => h("span", { class: "tag" + (it.why === "removed" ? " warn" : "") }, it[col] + (it.why === "removed" ? " (removed)" : ""), " ", h("button", { class: "btn quiet", type: "button", "aria-label": "Take " + it[col] + " off the list", onclick: () => dropListed(table, col, it[col]) }, "×"))))));
  q.append(listBox("Reserved names", "Exact names nobody but the editor can take. Names you remove from an account are added here.", reserved, "reserved_usernames", "username", "un-reserve", /^[a-z0-9_]{1,20}$/, "A reserved name is 1 to 20 letters, digits or underscores.", "Name to reserve"),
    listBox("Banned words", "A username that contains one of these words anywhere is refused.", banned, "banned_words", "word", "un-ban", /^[a-z0-9_]{3,20}$/, "A banned word is 3 to 20 letters, digits or underscores.", "Word to ban"));
}
async function removeUsername(id) { const { error } = await S.db.rpc("remove_username", { target: id }); if (error) return fail(error); await load(); toast("Username removed"); render(true); }
async function uploadImage() {
  if (!S.img) return null;
  const blob = await (await fetch(S.img)).blob();
  const path = S.me.id + "/" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + ".jpg";
  const { error } = await S.db.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  return path;
}
async function submitPiece(ev) {
  ev.preventDefault(); const f = readForm(); const err = document.getElementById("w-err");
  let msg = "";
  if (f.title.length < 8) msg = "Give the piece a headline of at least 8 characters.";
  else if (f.body.split(/\s+/).length < 80) msg = "The piece is under 80 words. Write more before you submit.";
  else if (!sourcesOk(f.sources)) msg = "List at least one source. Each line must be a link starting with https://, or the full name of a document.";
  else if (!disclosureOk(f.disclosure)) msg = "Write None in Disclosure, or describe the payment, gift, holding or affiliation in a full sentence.";
  else if (f.sebiReg && !SEBI.test(f.sebiReg)) msg = "A SEBI registration number is INH or INA followed by 9 digits. Correct it, or leave the box empty.";
  else if (f.section === "finance" && ADVICE.test(f.body) && !f.sebiReg) msg = "Remove the investment advice, or enter your SEBI registration number.";
  else if (S.img && f.imageAlt.length < 5) msg = "Describe the image in a few words for readers who cannot see it.";
  else if (S.img && f.imageCredit.length < 3) msg = "Add a credit for the image.";
  err.hidden = !msg; err.textContent = msg; if (msg) return;
  const btn = document.getElementById("w-go"); btn.disabled = true; let path = null;
  try {
    const direct = canDirect(S.me.id, f.section);
    const row = { section: f.section, label: f.label, title: f.title, dek: f.dek, body: f.body, sources: f.sources, disclosure: f.disclosure, sponsored: !!f.sponsored, future: !!f.future, sebi_reg: f.sebiReg || "" };
    const editing = S.editingId && S.mine.find((m) => m.id === S.editingId && (m.raw === "returned" || m.raw === "unpublished_by_editor"));
    path = await uploadImage();
    if (path) Object.assign(row, { image_path: path, image_alt: f.imageAlt, image_credit: f.imageCredit, image_ai: !!f.imageAI });
    const q = editing ? S.db.from("pieces").update(Object.assign(row, { status: "submitted" })).eq("id", editing.id)
                      : S.db.from("pieces").insert(Object.assign(row, { author_id: S.me.id, status: direct ? "published" : "submitted" }));
    const { error } = await q; if (error) throw error;
    // A replaced image is no longer used by anything, so its file is removed.
    if (path && editing && editing.imagePath && editing.imagePath !== path) await S.db.storage.from(BUCKET).remove([editing.imagePath]).catch(() => {});
    try { localStorage.removeItem("xs-draft"); } catch (e) {}
    S.img = null; S.editingId = null;
    await load(); toast(direct && !editing ? "Published" : "Submitted for review"); render(true); window.scrollTo(0, 0);
  } catch (e) {
    // The piece did not save, so an image uploaded for it is removed rather than left behind.
    if (path) await S.db.storage.from(BUCKET).remove([path]).catch(() => {});
    btn.disabled = false; err.hidden = false; err.textContent = (e && e.message) || "That did not save. Try again."; }
}
async function publish(s) {
  if (s.sebiReg && !SEBI.test(s.sebiReg)) return toast("The SEBI number is not valid. Send the piece back.");
  if (s.sebiReg && !val("sebi-ok-" + s.id)) return toast("Confirm you checked the SEBI number first.");
  await act(S.db.from("pieces").update({ status: "published" }).eq("id", s.id), "Published");
}
async function sendBack(s) {
  const note = val("note-" + s.id); if (!note) return toast("Write a note so the writer knows what to fix.");
  await act(S.db.from("pieces").update({ status: "returned", editor_note: note }).eq("id", s.id), "Sent back to the writer");
}
async function setLead(id) { await act(S.db.from("settings").update({ lead_piece_id: id || null }).eq("id", 1), id ? "Lead story set" : "The newest piece leads again"); }
async function setDirect(id, on) { await act(S.db.from("profiles").update({ direct_paused: !on }).eq("id", id), on ? "Direct publishing allowed" : "Direct publishing paused"); }
async function setWriter(id, on) { await act(S.db.from("profiles").update({ role: on ? "writer" : "reader" }).eq("id", id), on ? "Writer approved" : "Invitation withdrawn"); }
async function toggleLike(id) {
  if (iLike(id)) await act(S.db.from("likes").delete().eq("piece_id", id).eq("user_id", S.me.id));
  else await act(S.db.from("likes").insert({ piece_id: id, user_id: S.me.id }));
}
async function postComment(a, parentId) {
  const key = parentId ? "r" : "c"; const text = val(key + "-text"); if (text.length < 2) return toast("Write your comment first.");
  const btn = document.getElementById(key + "-go"); if (btn) btn.disabled = true;
  try {
    const row = { piece_id: a.id, author_id: S.me.id, body: text.slice(0, 1000) };
    if (parentId) row.parent_id = parentId;
    const { error } = await S.db.from("comments").insert(row); if (error) throw error;
    if (parentId) S.replyTo = null;
    await load(); toast(parentId ? "Reply posted" : "Comment posted"); render(true);
  } catch (e) { if (btn) btn.disabled = false; fail(e); }
}
async function hideComment(c) { await act(S.db.from("comments").update({ hidden: true }).eq("id", c.id), c.by === S.me.id ? "Comment deleted" : "Comment hidden"); }
async function addCorrection(a) {
  const text = val("corr-text"); if (text.length < 3) return toast("Write the correction first.");
  await act(S.db.from("corrections").insert({ piece_id: a.id, body: text, created_by: S.me.id }), "Correction added");
}
async function unpublish(a) {
  if (!(await run(S.db.from("pieces").update({ status: "unpublished_by_editor" }).eq("id", a.id)))) return;
  if (a.id === S.leadId) await run(S.db.from("settings").update({ lead_piece_id: null }).eq("id", 1));
  await load(); toast("Unpublished. It is kept in the Archive."); go("home");
}
async function withdraw(m, on) { await act(S.db.from("pieces").update({ status: on ? "unpublished_by_writer" : "published" }).eq("id", m.id), on ? "Unpublished. FTPC keeps a record of the piece." : "Back on the site"); }
async function declineAsk(m) { await act(S.db.from("pieces").update({ republish_requested: false }).eq("id", m.id), "Declined. The piece stays unpublished."); }
async function askRepublish(a) { await act(S.db.from("pieces").update({ republish_requested: true }).eq("id", a.id), "Request sent. The piece returns if the writer accepts."); }
async function restore(x) { await act(S.db.from("pieces").update({ status: "published" }).eq("id", x.id), "Restored to the site"); }
async function purge(x) {
  if (!(await run(S.db.from("pieces").delete().eq("id", x.id)))) return;
  if (x.imagePath) await S.db.storage.from(BUCKET).remove([x.imagePath]).catch(() => {});
  await load(); toast("Deleted permanently"); render(true);
}
async function toggleSave(id) {
  if (S.saved.includes(id)) await act(S.db.from("saves").delete().eq("piece_id", id).eq("user_id", S.me.id), "Removed from Saved");
  else await act(S.db.from("saves").insert({ piece_id: id, user_id: S.me.id }), "Saved");
}
async function sendReport(a, box) {
  if (await run(S.db.from("reports").insert({ piece_id: a.id, reporter_id: S.me.id, reason: val("rep-reason"), note: val("rep-note") }))) { box.hidden = true; toast("Report sent to the editor"); }
}
async function closeReport(r) { await act(S.db.from("reports").update({ handled: true }).eq("id", r.id), "Marked handled"); }

async function start() {
  const token = location.hash.replace(/^#/, "");
  S.route = /^(access_token|error|code)=/.test(token) ? { view: "home" } : parse(token);
  if (/^(access_token|code)=/.test(token) || /[?&]code=/.test(location.search)) markUsed();   // arriving from a sign-in link counts as use
  render(true);
  if (!window.supabase) { S.loadError = "the sign-in and data library did not load"; render(true); return; }
  S.db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  S.db.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "TOKEN_REFRESHED") setTimeout(() => refresh(false), 0); });
  await refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, 60000);
}
start();
</script>
